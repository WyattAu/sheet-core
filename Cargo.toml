[package]
name = "sheet-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/sheet-core"
homepage = "https://github.com/WyattAu/sheet-core"
documentation = "https://docs.rs/sheet-core"
description = "Spreadsheet data model — sparse cell storage, dependency DAG, topological evaluation order, formula reference extraction"
readme = "README.md"
keywords = ["spreadsheet", "xlsx", "cells", "formula", "no-std"]
categories = ["data-structures", "parser-implementations"]
exclude = [".github/", "supply-chain/"]

# Layer model: docs/layers.md in WyattAu/engineering-standards.
# L1 — substrate: zero estate-internal dependencies by mandate.
[package.metadata.layers]
tier = "L1"

[features]
default = []

# No runtime dependencies: sparse storage is `BTreeMap` over `core + alloc`,
# and formula reference extraction is a built-in lenient scanner (the estate
# has no published formula parser to lean on — see `refs` module docs).

[dev-dependencies]
proptest = "1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
